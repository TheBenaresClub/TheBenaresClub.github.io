<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlie Chaves · Cine Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root { --g: #5DA000; --ink: #f0f0f0; --ink2: #999; --ink3: #555; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; color: var(--ink); font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; }
    header { display: none !important; }
    #grain { display: none; }
    #main-nav  { display: none !important; }
    #nav-toggle { display: none !important; }
    footer { background: #000 !important; border-top: 1px solid #1a1a1a !important; }
    footer a { color: #444 !important; }

    .ch-hero {
      padding: 3.5rem 2.5rem 2rem;
      display: flex; align-items: flex-end; justify-content: space-between;
      border-bottom: 2px solid var(--g);
    }
    .ch-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 8vw, 6.5rem); line-height: 0.9; color: var(--g); letter-spacing: 0.01em; }
    .ch-roles { font-size: 0.72rem; color: var(--ink2); margin-top: 0.55rem; }
    .ch-hero-right { text-align: right; }
    .ch-hero-year { font-size: 0.55rem; color: var(--ink3); letter-spacing: 0.1em; display: block; margin-bottom: 0.15rem; }

    .ch-bar-nav {
      display: flex; align-items: center;
      padding: 0 2.5rem; background: #0d0d0d;
      border-top: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .ch-bar-nav::-webkit-scrollbar { display: none; }
    .ch-bar-nav-item {
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.12em;
      text-transform: uppercase; text-decoration: none;
      color: #888; padding: 0.75rem 1.1rem;
      border-bottom: 2px solid transparent;
      white-space: nowrap; transition: color 0.15s, border-color 0.15s;
      display: inline-flex; align-items: center;
    }
    .ch-bar-nav-item:hover { color: #ccc; }
    .ch-bar-nav-item.active { color: var(--g); border-bottom-color: var(--g); font-weight: 600; }

    .ch-empty { padding: 6rem 2.5rem; text-align: center; }
    .ch-empty-icon { font-size: 1.5rem; margin-bottom: 1rem; opacity: 0.15; }
    .ch-empty-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink3); }
    .ch-empty-note { font-size: 0.72rem; color: var(--ink3); margin-top: 0.5rem; }

    @media (max-width: 580px) {
      .ch-hero { padding: 2rem 1.5rem 1.5rem; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
      .ch-hero-right { display: none; }
    }
  </style>
</head>
<body>
  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
    <section class="ch-hero">
      <div>
        <h1 class="ch-name">Charlie<br>Chaves</h1>
        <p class="ch-roles">Director · Realizador · Lisboa</p>
      </div>
      <div class="ch-hero-right">
        <span class="ch-hero-year">2019 — 2026</span>
      </div>
    </section>

    <nav class="ch-bar-nav">
        <a class="ch-bar-nav-item" href="/charlie/">Cinema</a>
        <a class="ch-bar-nav-item active" href="/charlie/cineclub/">Cine Club</a>
        <a class="ch-bar-nav-item" href="/charlie/festival/">Film Festival</a>
        <a class="ch-bar-nav-item" href="/charlie/photography/">Photography</a>
        <a class="ch-bar-nav-item" href="/charlie/videography/">Videography</a>
        <a class="ch-bar-nav-item" href="/charlie/daily/">Daily Life</a>
    </nav>

    <div class="ch-empty">
      <div class="ch-empty-icon">◎</div>
      <p class="ch-empty-label">Cine Club</p>
      <p class="ch-empty-note">Em breve</p>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="/shared.js"></script>
</body>
</html>
