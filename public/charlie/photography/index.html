<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlie Chaves · Fotografia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root { --g: #5DA000; --neon: #39FF14; --ink: #f0f0f0; --ink2: #999; --ink3: #555; --border: rgba(255,255,255,0.08); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; color: var(--ink); font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; }
    footer { background: #000 !important; border-top: 1px solid #1a1a1a !important; }
    footer a { color: #444 !important; }
    #main-nav a { color: var(--g) !important; transition: color 0.15s, text-shadow 0.15s; }
    #main-nav a:hover, #main-nav a.active { color: var(--neon) !important; text-shadow: 0 0 8px var(--neon), 0 0 20px var(--neon); background: transparent !important; box-shadow: none !important; }

    .ch-hero { padding: 3.5rem 2.5rem 2rem; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid var(--g); }
    .ch-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem,8vw,6.5rem); line-height: 0.9; color: var(--g); letter-spacing: 0.01em; }
    .ch-roles { font-size: 0.72rem; color: var(--ink2); margin-top: 0.55rem; }
    .ch-hero-right { text-align: right; }
    .ch-hero-year { font-size: 0.55rem; color: var(--ink3); letter-spacing: 0.1em; display: block; margin-bottom: 0.15rem; }

    .ch-bar-nav { display: flex; align-items: center; padding: 0 2.5rem; background: #161616; border-bottom: 1px solid #333; overflow-x: auto; scrollbar-width: none; }
    .ch-bar-nav::-webkit-scrollbar { display: none; }
    .ch-bar-nav-item { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; color: #aaa; padding: 1rem 1.2rem; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color 0.15s, border-color 0.15s; display: inline-flex; align-items: center; }
    .ch-bar-nav-item:hover { color: #eee; }
    .ch-bar-nav-item.active { color: var(--g); border-bottom-color: var(--g); font-weight: 600; }

    .sec-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--g); }
    .placeholder { opacity: 0.18; pointer-events: none; }

    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; }
    .photo-cell { position: relative; overflow: hidden; background: #0d0d0d; cursor: pointer; }
    .photo-cell.tall { grid-row: span 2; }
    .photo-cell.wide { grid-column: span 2; }
    .photo-cell .photo-img { width: 100%; height: 100%; min-height: 220px; object-fit: cover; display: block; filter: grayscale(20%); transition: filter 0.3s, transform 0.4s; }
    .photo-cell:hover .photo-img { filter: grayscale(0); transform: scale(1.03); }
    .photo-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.2rem; background: linear-gradient(transparent, rgba(0,0,0,0.9)); opacity: 0; transition: opacity 0.25s; }
    .photo-cell:hover .photo-overlay { opacity: 1; }
    .photo-series { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: #f0f0f0; letter-spacing: 0.05em; }
    .photo-year { font-size: 0.6rem; color: var(--g); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 0.2rem; }
    .photo-placeholder { width: 100%; height: 100%; min-height: 220px; display: flex; align-items: center; justify-content: center; }
    .photo-placeholder svg { opacity: 0.08; }
    .photo-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 2.5rem; border-bottom: 1px solid #1a1a1a; }
    @media (max-width: 580px) {
      .ch-hero { padding: 2rem 1.5rem 1.5rem; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
      .ch-hero-right { display: none; }
    }
  </style>
</head>
<body>
  <div id="grain"></div>
  <div id="header-container"></div>
  <main>

    <nav class="ch-bar-nav">
        <a class="ch-bar-nav-item" href="/charlie/">Cinema</a>
        <a class="ch-bar-nav-item" href="/charlie/cineclub/">Cine Club</a>
        <a class="ch-bar-nav-item" href="/charlie/festival/">Film Festival</a>
        <a class="ch-bar-nav-item active" href="/charlie/photography/">Photography</a>
        <a class="ch-bar-nav-item" href="/charlie/videography/">Videography</a>
        <a class="ch-bar-nav-item" href="/charlie/daily/">Daily Life</a>
    </nav>

    <div class="photo-bar">
      <span class="sec-label">Fotografia</span>
    </div>

    <div class="photo-grid">
      <div class="photo-cell tall">
        <div class="photo-placeholder placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="7.5" r="1" fill="white"/></svg></div>
        <div class="photo-overlay">
          <p class="photo-series placeholder">SÉRIE 01</p>
          <p class="photo-year placeholder">Ano</p>
        </div>
      </div>
      <div class="photo-cell ">
        <div class="photo-placeholder placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="7.5" r="1" fill="white"/></svg></div>
        <div class="photo-overlay">
          <p class="photo-series placeholder">SÉRIE 02</p>
          <p class="photo-year placeholder">Ano</p>
        </div>
      </div>
      <div class="photo-cell ">
        <div class="photo-placeholder placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="7.5" r="1" fill="white"/></svg></div>
        <div class="photo-overlay">
          <p class="photo-series placeholder">SÉRIE 03</p>
          <p class="photo-year placeholder">Ano</p>
        </div>
      </div>
      <div class="photo-cell wide">
        <div class="photo-placeholder placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="7.5" r="1" fill="white"/></svg></div>
        <div class="photo-overlay">
          <p class="photo-series placeholder">SÉRIE 04</p>
          <p class="photo-year placeholder">Ano</p>
        </div>
      </div>
      <div class="photo-cell ">
        <div class="photo-placeholder placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="7.5" r="1" fill="white"/></svg></div>
        <div class="photo-overlay">
          <p class="photo-series placeholder">SÉRIE 05</p>
          <p class="photo-year placeholder">Ano</p>
        </div>
      </div>
      <div class="photo-cell tall">
        <div class="photo-placeholder placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="7.5" r="1" fill="white"/></svg></div>
        <div class="photo-overlay">
          <p class="photo-series placeholder">SÉRIE 06</p>
          <p class="photo-year placeholder">Ano</p>
        </div>
      </div>
      <div class="photo-cell ">
        <div class="photo-placeholder placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="7.5" r="1" fill="white"/></svg></div>
        <div class="photo-overlay">
          <p class="photo-series placeholder">SÉRIE 07</p>
          <p class="photo-year placeholder">Ano</p>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="/shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var logo = document.querySelector('#header-container img');
      if (logo) {
        logo.src = '/Imagenes/01 Banners/Club Benares - Charlie logo.png';
        logo.alt = 'Charlie Chaves · Club Benares';
        logo.style.height = '72px';
      }
      var nav = document.querySelector('#main-nav ul');
      if (nav) {
        nav.innerHTML = [
          ['/charlie/',             'Filmografia'],
          ['/charlie/videography/', 'Videografia'],
          ['/charlie/photography/', 'Fotografia'],
          ['/charlie/cineclub/',    'Cine Club'],
          ['/charlie/festival/',    'Film Festival'],
          ['/charlie/contact/',     'Contact'],
        ].map(function(item) {
          var active = window.location.pathname === item[0] ? 'active' : '';
          return '<li><a href="' + item[0] + '" class="' + active + '">' + item[1] + '</a></li>';
        }).join('');
      }
    });
  </script>
</body>
</html>
